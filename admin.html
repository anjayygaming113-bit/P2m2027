<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — P2M 2027</title>
<style>
:root{
  --green:#0d5c3a; --green2:#14734a; --cream:#f7f3e8; --gold:#c9a84e;
  --dark:#123127; --white:#fff; --muted:#66756e; --danger:#c94e4e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color: transparent;}
body{font-family:Arial,Helvetica,sans-serif;color:var(--dark);background:#f4f7f5;line-height:1.6}
a{text-decoration:none;color:inherit}

.admin-container{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--dark);color:#fff;padding:25px 20px;position:fixed;height:100%;overflow-y:auto}
.sidebar h2{font-size:18px;color:var(--gold);margin-bottom:30px;letter-spacing:1px}
.sidebar-menu{display:flex;flex-direction:column;gap:10px}
.sidebar-menu a{padding:12px 15px;border-radius:12px;font-size:14px;font-weight:700;color:#cbd5d0;transition:all .2s}
.sidebar-menu a:hover, .sidebar-menu a.active{background:var(--green);color:#fff}

.main-content{margin-left:260px;flex:1;padding:30px 40px}
.header-top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:20px 30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.04);margin-bottom:30px}
.header-top h1{font-size:22px;color:var(--green)}
.back-site{font-size:13px;font-weight:700;background:var(--cream);color:var(--green);padding:8px 16px;border-radius:10px;border:1px solid #ebdcc4}

.admin-card{background:#fff;padding:30px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.04);margin-bottom:30px}
.admin-card h3{font-size:18px;color:var(--green);margin-bottom:20px;border-bottom:2px solid var(--cream);padding-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.form-group input, .form-group select, .form-group textarea{width:100%;padding:12px 16px;border:1px solid #dce6e0;border-radius:12px;font-family:inherit;font-size:14px;background:#f9fbf9;outline:none;}
.btn-save{padding:12px 24px;background:var(--green);color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;}
.btn-save:hover{background:var(--green2)}

table{width:100%;border-collapse:collapse;margin-top:10px}
th, td{padding:14px 16px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f9fbf9;color:var(--green);font-weight:800}
td img{width:40px;height:40px;object-fit:cover;border-radius:8px;}
.action-btns{display:flex;gap:8px}
.btn-del{background:var(--danger);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;border:none;cursor:pointer}

@media(max-width:800px){
  .sidebar{width:70px;padding:20px 10px}
  .sidebar h2, .sidebar-menu span{display:none}
  .main-content{margin-left:70px;padding:20px}
}
</style>
</head>
<body>

<div class="admin-container">
  <aside class="sidebar">
    <h2>P2M 2027 ADMIN</h2>
    <div class="sidebar-menu">
      <a href="#" class="active">📊 Dashboard Utama</a>
      <a href="index.html" style="margin-top:20px; color:#f8e8af;">← Kembali ke Website</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="header-top">
      <h1>Dashboard Kelola Anggota P2M</h1>
      <a href="index.html" class="back-site" target="_blank">Lihat Website Live ↗</a>
    </div>

    <!-- TAMBAH PENGURUS UTAMA -->
    <div class="admin-card">
      <h3>Tambah Kartu Pengurus / Divisi Utama</h3>
      <form id="add-team-form">
        <div class="form-grid">
          <div class="form-group"><label>Nama Lengkap</label><input type="text" id="add-name" required></div>
          <div class="form-group"><label>Jabatan / Divisi</label><input type="text" id="add-role" placeholder="Contoh: Ketua Umum / Divisi PDD" required></div>
          <div class="form-group"><label>Nama File Foto (.jpg)</label><input type="text" id="add-img" placeholder="Contoh: ketua_umum.jpg" required></div>
        </div>
        <button type="submit" class="btn-save">Tambah Kartu Tim</button>
      </form>
    </div>

    <!-- TABEL DAFTAR TIM -->
    <div class="admin-card">
      <h3>Daftar Pengurus Saat Ini</h3>
      <table>
        <thead><tr><th>Foto</th><th>Nama</th><th>Jabatan</th><th>Aksi</th></tr></thead>
        <tbody id="admin-team-table"></tbody>
      </table>
    </div>

    <!-- GANTI FOTO UTAMA ANGKATAN -->
    <div class="admin-card">
      <h3>Perbarui Foto Utama Angkatan XVI</h3>
      <form id="update-angkatan-form">
        <div class="form-group"><label>Nama File Foto Angkatan di GitHub (Contoh: angkatan_xvi.jpg)</label><input type="text" id="angkatan-img-input" required></div>
        <button type="submit" class="btn-save">Perbarui Foto Angkatan</button>
      </form>
    </div>
  </main>
</div>

<script>
const defaultTeam = [
  {id:'ketua', name:'Muhammad Naufal Ismail', role:'Ketua Umum', img:'ketua_umum.jpg', members:[]},
  {id:'ketua1', name:'Rafli Habiburrohman', role:'Ketua 1', img:'ketua1.jpg', members:[]},
  {id:'ketua2', name:'Muhammad Ridho Al Baroki', role:'Ketua 2', img:'ketua2.jpg', members:[]},
  {id:'ketua3', name:'Muhammad Azam Maulidan', role:'Ketua 3', img:'ketua3.jpg', members:[]},
  {id:'sekretaris', name:'Dana Jaenal Mutakin', role:'Sekretaris', img:'sekretaris.jpg', members:[{name:'Dana Jaenal Mutakin', img:'sekretaris.jpg'}]},
  {id:'bendahara', name:'Karin Waladiatul Ramdani', role:'Bendahara', img:'bendahara.jpg', members:[{name:'Karin Waladiatul Ramdani', img:'bendahara.jpg'}]},
  {id:'pdd', name:'Arshal Dinur Fauzan', role:'Divisi PDD', img:'pdd.jpg', members:[{name:'Sandi Pirmansah', img:'pdd_sandi.jpg'}, {name:'M. Al-fauzan', img:'pdd_fauzan.jpg'}, {name:'Erni Nurwidiyanti', img:'pdd_erni.jpg'}, {name:'Raihana Kansa Aulia', img:'pdd_raihana.jpg'}]},
  {id:'acara', name:'Nisa Adila Wardani', role:'Divisi Acara', img:'acara.jpg', members:[{name:'Nisa Adila Wardani', img:'acara.jpg'}]}
];

let teamData = JSON.parse(localStorage.getItem('p2m_team')) || defaultTeam;

function renderAdminTable() {
  const tbody = document.getElementById('admin-team-table');
  tbody.innerHTML = '';
  teamData.forEach((item, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><img src="${item.img}" onerror="this.src='bg.jpg'"></td>
      <td><b>${item.name}</b></td>
      <td>${item.role}</td>
      <td><button class="btn-del" onclick="deleteTeamMember(${index})">Hapus</button></td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('add-team-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('add-name').value;
  const role = document.getElementById('add-role').value;
  const img = document.getElementById('add-img').value;
  teamData.push({id: 'item_'+Date.now(), name, role, img, members:[]});
  localStorage.setItem('p2m_team', JSON.stringify(teamData));
  renderAdminTable();
  alert('Anggota berhasil ditambahkan!');
  this.reset();
});

function deleteTeamMember(index) {
  if(confirm('Yakin ingin menghapus data ini?')) {
    teamData.splice(index, 1);
    localStorage.setItem('p2m_team', JSON.stringify(teamData));
    renderAdminTable();
  }
}

document.getElementById('update-angkatan-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const imgName = document.getElementById('angkatan-img-input').value;
  localStorage.setItem('p2m_angkatan_img', imgName);
  alert('Foto Angkatan XVI berhasil diperbarui!');
});

document.addEventListener('DOMContentLoaded', renderAdminTable);
</script>
</body>
</html>
