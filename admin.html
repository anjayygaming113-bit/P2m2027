<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — P2M 2027</title>
<style>
:root{
  --green:#0d5c3a; --green2:#14734a; --cream:#f7f3e8; --gold:#c9a84e;
  --dark:#123127; --white:#fff; --muted:#66756e; --danger:#c94e4e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color: transparent;}
body{font-family:Arial,Helvetica,sans-serif;color:var(--dark);background:#f4f7f5;line-height:1.6}
a{text-decoration:none;color:inherit}

.admin-container{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--dark);color:#fff;padding:25px 20px;position:fixed;height:100%;overflow-y:auto}
.sidebar h2{font-size:18px;color:var(--gold);margin-bottom:30px;letter-spacing:1px}
.sidebar-menu{display:flex;flex-direction:column;gap:10px}
.sidebar-menu a{padding:12px 15px;border-radius:12px;font-size:14px;font-weight:700;color:#cbd5d0;transition:all .2s}
.sidebar-menu a:hover, .sidebar-menu a.active{background:var(--green);color:#fff}

.main-content{margin-left:260px;flex:1;padding:30px 40px}
.header-top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:20px 30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.04);margin-bottom:30px}
.header-top h1{font-size:22px;color:var(--green)}
.back-site{font-size:13px;font-weight:700;background:var(--cream);color:var(--green);padding:8px 16px;border-radius:10px;border:1px solid #ebdcc4}

.admin-card{background:#fff;padding:30px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.04);margin-bottom:30px}
.admin-card h3{font-size:18px;color:var(--green);margin-bottom:20px;border-bottom:2px solid var(--cream);padding-bottom:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--dark)}
.form-group input, .form-group select{width:100%;padding:12px 16px;border:1px solid #dce6e0;border-radius:12px;font-family:inherit;font-size:14px;background:#f9fbf9;outline:none;}
.btn-save{padding:12px 24px;background:var(--green);color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;}
.btn-save:hover{background:var(--green2)}

table{width:100%;border-collapse:collapse;margin-top:10px}
th, td{padding:14px 16px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#f9fbf9;color:var(--green);font-weight:800}
td img{width:40px;height:40px;object-fit:cover;border-radius:8px;}
.btn-del{background:var(--danger);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:bold;border:none;cursor:pointer}

@media(max-width:800px){
  .sidebar{width:70px;padding:20px 10px}
  .sidebar h2, .sidebar-menu span{display:none}
  .main-content{margin-left:70px;padding:20px}
}
</style>
</head>
<body>

<div class="admin-container">
  <aside class="sidebar">
    <h2>P2M 2027 ADMIN</h2>
    <div class="sidebar-menu">
      <a href="#" class="active">📊 Dashboard Utama</a>
      <a href="index.html" style="margin-top:20px; color:#f8e8af;">← Kembali ke Website</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="header-top">
      <h1>Dashboard Kelola Anggota P2M</h1>
      <a href="index.html" class="back-site" target="_blank">Lihat Website Live ↗</a>
    </div>

    <!-- TAMBAH ANGGOTA KEDALAM SUB-DIVISI (CONTOH: PENGGIAT PDD) -->
    <div class="admin-card">
      <h3>Tambah Anggota ke dalam Divisi (Misal: Anggota PDD)</h3>
      <form id="add-submember-form">
        <div class="form-grid">
          <div class="form-group">
            <label>Pilih Divisi Tujuan</label>
            <select id="sub-divisi-target" required>
              <option value="pdd">Divisi PDD</option>
              <option value="acara">Divisi Acara</option>
              <option value="peralatan">Divisi Peralatan</option>
              <option value="logistik">Divisi Logistik</option>
              <option value="keamanan">Divisi Keamanan</option>
              <option value="konsumsi">Divisi Konsumsi</option>
              <option value="tarbiyah">Divisi Tarbiyah</option>
              <option value="dakwah">Divisi Dakwah</option>
              <option value="permainan">Divisi Permainan</option>
              <option value="perlombaan">Divisi Perlombaan</option>
              <option value="sosmas">Divisi Sosmas</option>
              <option value="sosek">Divisi Sosek</option>
              <option value="hal">Divisi Hub. Antar Lembaga</option>
              <option value="kesehatan">Divisi Kesehatan</option>
              <option value="kebersihan">Divisi Kebersihan</option>
              <option value="support">Divisi Support</option>
            </select>
          </div>
          <div class="form-group"><label>Nama Anggota Baru</label><input type="text" id="sub-name" placeholder="Contoh: Sandi Pirmansah" required></div>
          <div class="form-group"><label>Nama File Foto (.jpg)</label><input type="text" id="sub-img" placeholder="Contoh: pdd_sandi.jpg" required></div>
        </div>
        <button type="submit" class="btn-save">Tambah Anggota ke Divisi</button>
      </form>
    </div>

    <!-- KELOLA FOTO UTAMA ANGKATAN -->
    <div class="admin-card">
      <h3>Perbarui Foto Utama Angkatan XVI</h3>
      <form id="update-angkatan-form">
        <div class="form-group"><label>Nama File Foto Angkatan di GitHub (Contoh: angkatan_xvi.jpg)</label><input type="text" id="angkatan-img-input" required></div>
        <button type="submit" class="btn-save">Perbarui Foto Angkatan</button>
      </form>
    </div>
  </main>
</div>

<script>
const defaultTeam = [
  {id:'ketua', name:'Muhammad Naufal Ismail', role:'Ketua Umum', img:'ketua_umum.jpg', members:[]},
  {id:'ketua1', name:'Rafli Habiburrohman', role:'Ketua 1', img:'ketua1.jpg', members:[]},
  {id:'ketua2', name:'Muhammad Ridho Al Baroki', role:'Ketua 2', img:'ketua2.jpg', members:[]},
  {id:'ketua3', name:'Muhammad Azam Maulidan', role:'Ketua 3', img:'ketua3.jpg', members:[]},
  {id:'sekretaris', name:'Dana Jaenal Mutakin', role:'Sekretaris', img:'sekretaris.jpg', members:[{name:'Dana Jaenal Mutakin', img:'sekretaris.jpg'}]},
  {id:'bendahara', name:'Karin Waladiatul Ramdani', role:'Bendahara', img:'bendahara.jpg', members:[{name:'Karin Waladiatul Ramdani', img:'bendahara.jpg'}]},
  {id:'pdd', name:'Arshal Dinur Fauzan', role:'Divisi PDD', img:'pdd.jpg', members:[{name:'Sandi Pirmansah', img:'pdd_sandi.jpg'}, {name:'M. Al-fauzan', img:'pdd_fauzan.jpg'}, {name:'Erni Nurwidiyanti', img:'pdd_erni.jpg'}, {name:'Raihana Kansa Aulia', img:'pdd_raihana.jpg'}]},
  {id:'acara', name:'Nisa Adila Wardani', role:'Divisi Acara', img:'acara.jpg', members:[{name:'Nisa Adila Wardani', img:'acara.jpg'}]},
  {id:'peralatan', name:'Zia Al-khulaeni', role:'Divisi Peralatan', img:'peralatan.jpg', members:[{name:'Zia Al-khulaeni', img:'peralatan.jpg'}]},
  {id:'logistik', name:'Muhammad Akmal Al Fajri', role:'Divisi Logistik', img:'logistik.jpg', members:[{name:'Muhammad Akmal Al Fajri', img:'logistik.jpg'}]},
  {id:'keamanan', name:'Indhira Hadi Pancasatria', role:'Divisi Keamanan', img:'keamanan.jpg', members:[{name:'Indhira Hadi Pancasatria', img:'keamanan.jpg'}]},
  {id:'konsumsi', name:'Rahma Putri Ramadani', role:'Divisi Konsumsi', img:'konsumsi.jpg', members:[{name:'Rahma Putri Ramadani', img:'konsumsi.jpg'}]},
  {id:'tarbiyah', name:'Hilya Nadzira Majdina', role:'Divisi Tarbiyah', img:'tarbiyah.jpg', members:[{name:'Hilya Nadzira Majdina', img:'tarbiyah.jpg'}]},
  {id:'dakwah', name:'Muhammad Azzam Maulidan', role:'Divisi Dakwah', img:'dakwah.jpg', members:[{name:'Muhammad Azzam Maulidan', img:'dakwah.jpg'}]},
  {id:'permainan', name:'Difa Mulki Hanifa', role:'Divisi Permainan', img:'permainan.jpg', members:[{name:'Difa Mulki Hanifa', img:'permainan.jpg'}]},
  {id:'perlombaan', name:'Yusfi Ruslan Atsaury', role:'Divisi Perlombaan', img:'perlombaan.jpg', members:[{name:'Yusfi Ruslan Atsaury', img:'perlombaan.jpg'}]},
  {id:'sosmas', name:'Pyckan Ramadania Putri', role:'Divisi Sosmas', img:'sosmas.jpg', members:[{name:'Pyckan Ramadania Putri', img:'sosmas.jpg'}]},
  {id:'sosek', name:'Raisa Musakinah', role:'Divisi Sosek', img:'sosek.jpg', members:[{name:'Raisa Musakinah', img:'sosek.jpg'}]},
  {id:'hal', name:'Dani Muhammad Ridwan', role:'Divisi Hub. Antar Lembaga', img:'hal.jpg', members:[{name:'Dani Muhammad Ridwan', img:'hal.jpg'}]},
  {id:'kesehatan', name:'Rahmi Lestari S.M', role:'Divisi Kesehatan', img:'kesehatan.jpg', members:[{name:'Rahmi Lestari S.M', img:'kesehatan.jpg'}]},
  {id:'kebersihan', name:'Ryan Sukma Gunardi', role:'Divisi Kebersihan', img:'kebersihan.jpg', members:[{name:'Ryan Sukma Gunardi', img:'kebersihan.jpg'}]},
  {id:'support', name:'Muhammad Raihan Firdaus', role:'Divisi Support', img:'support.jpg', members:[{name:'Muhammad Raihan Firdaus', img:'support.jpg'}]}
];

let teamData = JSON.parse(localStorage.getItem('p2m_team')) || defaultTeam;

document.getElementById('add-submember-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const targetId = document.getElementById('sub-divisi-target').value;
  const name = document.getElementById('sub-name').value;
  const img = document.getElementById('sub-img').value;

  const divisi = teamData.find(d => d.id === targetId);
  if(divisi) {
    if(!divisi.members) divisi.members = [];
    divisi.members.push({name, img});
    localStorage.setItem('p2m_team', JSON.stringify(teamData));
    alert(`Berhasil menambahkan ${name} ke dalam ${divisi.role}!`);
    this.reset();
  }
});

document.getElementById('update-angkatan-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const imgName = document.getElementById('angkatan-img-input').value;
  localStorage.setItem('p2m_angkatan_img', imgName);
  alert('Foto Angkatan XVI berhasil diperbarui!');
});
</script>
</body>
</html>
